model_name: distil-large-v3
model_path: Systran/faster-distil-whisper-large-v3
language: en
task: transcribe
beam_size: 5
best_of: 5
device: cpu
compute_type: int8
vad_filter: true
condition_on_previous_text: false
use_batched: false  # batched inference only helps on GPU/many-core; ~neutral on CPU
batch_size: 8
cpu_threads: 4
num_workers: 1

finetune:
  model_name: openai/whisper-small
  language: Hindi
  task: transcribe
  num_train_epochs: 10
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 1e-5
  warmup_steps: 500
  fp16: false
  generation_max_length: 225
